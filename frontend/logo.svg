<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="mvg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5252"/><stop offset="1" stop-color="#7f0000"/>
    </linearGradient>
  </defs>
  <style>
    .spin{animation:spin .45s linear infinite;transform-box:fill-box;transform-origin:center}
    .float{animation:float 3s ease-in-out infinite}
    .ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes float{50%{transform:translateY(-4px)}}
    @keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.5);opacity:0}}
  </style>
  <rect width="120" height="120" rx="28" fill="url(#mvg)"/>
  <circle class="ring" cx="60" cy="64" r="30" fill="none" stroke="#fff" stroke-width="2"/>
  <g class="float">
    <path d="M34 42 L52 58 M86 42 L68 58 M34 88 L52 72 M86 88 L68 72" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <ellipse class="spin" cx="30" cy="38" rx="14" ry="3" fill="#fff" opacity=".9"/>
    <ellipse class="spin" cx="90" cy="38" rx="14" ry="3" fill="#fff" opacity=".9"/>
    <ellipse class="spin" cx="30" cy="92" rx="14" ry="3" fill="#fff" opacity=".9"/>
    <ellipse class="spin" cx="90" cy="92" rx="14" ry="3" fill="#fff" opacity=".9"/>
    <rect x="46" y="52" width="28" height="26" rx="9" fill="#fff"/>
    <rect x="57" y="57" width="6" height="16" rx="1.5" fill="#d32f2f"/>
    <rect x="52" y="62" width="16" height="6" rx="1.5" fill="#d32f2f"/>
  </g>
</svg>