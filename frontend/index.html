<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAYVEX</title><script src="common.js"></script></head>
<body>
<div class="top"><b>MAYVEX</b></div>
<div class="box" style="max-width:380px;margin:30px auto">
  <h2 id="title">Login</h2>
  <div id="signupOnly" style="display:none">
    <input id="name" placeholder="Full name">
    <input id="phone" placeholder="Phone number">
  </div>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="btn" onclick="go()">Login</button>
  <p id="msg" style="color:#c62828;min-height:20px"></p>
  <a href="#" id="sw" onclick="toggle();return false">New customer? Sign up</a>
  <p style="font-size:12px;color:#666">Pharmacy staff: login with the seller account you were given.</p>
</div>
<script>
let signup = false;
function toggle() {
  signup = !signup;
  $("signupOnly").style.display = signup ? "block" : "none";
  $("title").textContent = $("btn").textContent = signup ? "Sign up" : "Login";
  $("sw").textContent = signup ? "Have an account? Login" : "New customer? Sign up";
  $("msg").textContent = "";
}
async function go() {
  try {
    const b = { email: $("email").value.trim(), password: $("password").value };
    if (signup) Object.assign(b, { name: $("name").value.trim(), phone: $("phone").value.trim() });
    const d = await api(signup ? "/api/signup" : "/api/login", "POST", b);
    localStorage.token = d.token; localStorage.role = d.role; localStorage.name = d.name;
    location = d.role === "seller" ? "seller.html" : "customer.html";
  } catch (e) {
    $("msg").textContent = e.message === "Failed to fetch"
      ? "Cannot reach the server. Is the backend running?" : e.message;
  }
}
// Press Enter in any box to submit
document.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
</script></body></html>
